#
# CI: run both offline test suites and validate the Dockerfile builds.
# Only the docker branch -- main mirrors upstream and runs nothing.
# (The multi-arch image publish lives in release-docker.yml, which fires
# on v* tags; tags are cut from the docker branch.)
name: ci

on:
  push:
    branches: [docker]
  pull_request:
    branches: [docker]

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: upstream offline suite
        run: python test_offline.py
      - name: docker-branch suite
        run: python test_branch.py

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
