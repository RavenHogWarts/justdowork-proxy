# ---------------------------------------------------------------------------
#  No key or config file needed to start:
#
#      docker compose up -d --build
#
#  The proxy comes up on http://127.0.0.1:18181 and uses the API key each
#  client sends (cc-switch mode); you can also set a fallback key any time
#  in the dashboard. Optional .env mount / overrides: see DOCKER.md.
# ---------------------------------------------------------------------------
services:
  ccproxy:
    build: .
    image: ccproxy
    container_name: ccproxy
    restart: unless-stopped
    init: true                    # PID-1 signal handling / zombie reaping
    logging:
      driver: json-file           # keep `docker logs` bounded
      options:
        max-size: "10m"
        max-file: "3"
    # host binding defaults to loopback: the proxy has no auth of its own,
    # so anyone who can reach the port can spend your relay key.
    # Set CCPROXY_BIND=0.0.0.0 only on a trusted, firewalled network.
    ports:
      - "${CCPROXY_BIND:-127.0.0.1}:${CCPROXY_PORT:-18181}:8181"
    environment:
      # optional overrides; empty means "use config.json"
      TARGET_URL: "${TARGET_URL:-}"
      UI_LANG: "${UI_LANG:-}"
      # optional access token for anything beyond loopback (see DOCKER.md)
      CCPROXY_TOKEN: "${CCPROXY_TOKEN:-}"
    # Optional: mount an .env file to persist a fallback key across
    # container REcreations (a plain `docker restart` already keeps it):
    # volumes:
    #   - ./.env:/app/.env
